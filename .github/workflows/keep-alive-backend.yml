name: Keep Alive - Render Backend Service

on:
  schedule:
    # Runs every 7 minutes to prevent Render free tier from sleeping (15 min inactivity timeout)
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Backend Service
    runs-on: ubuntu-latest
    steps:
      - name: Send Robust HTTP Ping to Render Backend
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://sanket-backend-epo6.onrender.com"
          fi

          # Strip any accidental internal port (:10000) or health path
          TARGET_URL=$(echo "$TARGET_URL" | sed -E 's/:10000(\/.*)?$//')
          TARGET_URL=$(echo "$TARGET_URL" | sed -E 's/\/(health|api\/health)\/?$//')

          echo "Pinging Render Backend URL: $TARGET_URL"

          # Use -sSL for follow redirects, --max-time 120 for Render cold start, and retries
          HTTP_STATUS=$(curl -sSL -o /dev/null -w "%{http_code}" \
            -A "Sanket-KeepAlive-Bot/2.0" \
            --connect-timeout 45 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "$TARGET_URL" || echo "000")

          echo "HTTP Response Status Code: $HTTP_STATUS"
          # 2xx, 3xx, and 404 (if root route isn't deployed yet) confirm Render received the request and is awake
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -le 404 ]; then
            echo "SUCCESS: Backend service is awake and operational (HTTP $HTTP_STATUS)."
          else
            echo "WARNING: Backend service returned unexpected HTTP status $HTTP_STATUS"
            exit 1
          fi
