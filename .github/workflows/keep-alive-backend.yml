name: Keep Alive - Render Backend Service

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping (15 min inactivity timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Backend Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://sanket-backend.onrender.com/api/health"
          fi
          echo "Pinging Render Backend URL: $TARGET_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL")
          echo "HTTP Response Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "SUCCESS: Backend service is awake and operational."
          else
            echo "WARNING: Backend service returned HTTP status $HTTP_STATUS"
          fi
